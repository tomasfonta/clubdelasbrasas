services:
  - type: web
    name: elclubdelasbrasas
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PATH
        value: admin
      - key: BASE_URL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: SESSION_SECRET
        generateValue: true
